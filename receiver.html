<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tilt Racket TV</title>
<style>html,body{margin:0;width:100%;height:100%;background:#080f1c;color:white;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><div style="position:fixed;top:8px;right:12px;z-index:10;color:#a8bdd3;background:#080f1c99;padding:3px 7px;border-radius:5px;font:12px system-ui;pointer-events:none">v5.0</div><canvas id="screen"></canvas><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><script>
(()=>{'use strict';
const c=document.getElementById('screen'),ctx=c.getContext('2d');
const W=400,H=500,NS='urn:x-cast:com.tiltracket.game';
const p={x:200,y:451,w:96,h:13},b={x:200,y:90,vx:65,vy:20,r:9};
let target=200,velocity=0,packetAt=0,lastSeq=-1,packetCount=0,maxGap=0,avgGap=0,gapSamples=[],targetVelocity=0,hits=0,over=false,last=0,lastControl=0,receiverStatus='Starting receiver…',senderId=null,receiver=null,lastState=0;
let predicted=200,correction=0,age=0;
function sendState(){if(receiver&&senderId){try{receiver.sendCustomMessage(NS,senderId,{type:'state',hits,over})}catch(e){receiverStatus='State send error: '+e.message}}}
function handlePaddle(m){
 if(!Number.isFinite(m.x))return;
 if(Number.isFinite(m.seq)&&m.seq<=lastSeq)return;
 if(Number.isFinite(m.seq))lastSeq=m.seq;
 const now=performance.now();
 if(packetAt){const gap=now-packetAt;gapSamples.push({t:now,gap})}
 while(gapSamples.length&&now-gapSamples[0].t>5000)gapSamples.shift();
 maxGap=gapSamples.length?Math.max(...gapSamples.map(v=>v.gap)):0;
 avgGap=gapSamples.length?gapSamples.reduce((a,v)=>a+v.gap,0)/gapSamples.length:0;
 packetAt=now;packetCount++;
 target=Math.max(p.w/2,Math.min(W-p.w/2,m.x*W));
 targetVelocity=Number.isFinite(m.vx)?Math.max(-1000,Math.min(1000,m.vx*W)):0;
 lastControl=Date.now();
}
function reset(){hits=0;over=false;b.x=200;b.y=90;b.vx=65;b.vy=20;sendState();}
function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=Math.round(innerWidth*d);c.height=Math.round(innerHeight*d)}
addEventListener('resize',resize);resize();
function update(dt){
 // Predict briefly from measured phone velocity, then stop extrapolating.
 const age=packetAt?performance.now()-packetAt:Infinity;
 const horizon=Math.min(age,85)/1000;
 const desired=Math.max(p.w/2,Math.min(W-p.w/2,target+targetVelocity*horizon));
 // Frame-rate independent critically damped spring with a modest maximum speed.
 const omega=22;
 const error=desired-p.x;
 const acceleration=omega*omega*error-2*omega*velocity;
 velocity=Math.max(-1150,Math.min(1150,velocity+acceleration*dt));
 const step=velocity*dt;
 if(Math.abs(error)<.2&&Math.abs(velocity)<3){p.x=desired;velocity=0}
 else if(Math.abs(step)>Math.abs(error)&&Math.sign(step)===Math.sign(error)){p.x=desired;velocity=0}
 else p.x=Math.max(p.w/2,Math.min(W-p.w/2,p.x+step));
 correction=Math.abs(error);
if(over || !lastControl || Date.now()-lastControl>2500)return;
const old=b.y;b.vy+=420*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)}
if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)}
if(b.vy>0&&old+b.r<=p.y&&b.y+b.r>=p.y&&Math.abs(b.x-p.x)<p.w/2+b.r){b.y=p.y-b.r;b.vy=-Math.min(530,330+hits*9);b.vx=(b.x-p.x)/(p.w/2)*165;hits++;sendState()}
if(b.y-b.r>H){over=true;sendState();}}
function draw(){const cw=c.width,ch=c.height;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#080f1c';ctx.fillRect(0,0,cw,ch);
const scale=Math.min(cw/W,ch/H)*.94,ox=(cw-W*scale)/2,oy=(ch-H*scale)/2;
ctx.setTransform(scale,0,0,scale,ox,oy);
ctx.fillStyle='#101e33';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#20344d';ctx.lineWidth=1;
for(let x=40;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
for(let y=40;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.fillStyle='#dce7f5';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText('HITS  '+hits,W/2,35);
// fillRect instead of roundRect: older Cast WebViews may not implement CanvasRenderingContext2D.roundRect.
ctx.fillStyle='#51d7ae';ctx.fillRect(p.x-p.w/2,p.y,p.w,p.h);
ctx.fillStyle='#ffd16b';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
if(over){ctx.fillStyle='rgba(4,10,20,.74)';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='bold 30px system-ui';ctx.fillText('Game over',W/2,240);ctx.font='16px system-ui';ctx.fillText('Restart on phone',W/2,275)}
ctx.fillStyle='#a8bdd3';ctx.font='12px system-ui';ctx.fillText(!lastControl?'Waiting for phone controller…':(Date.now()-lastControl<2500?'Phone controls received':'Phone disconnected / updates paused'),W/2,65);
ctx.font='11px system-ui';ctx.fillStyle='#8da5ba';ctx.fillText('Cast · avg '+Math.round(avgGap)+'ms · max '+Math.round(maxGap)+'ms · correction '+Math.round(correction)+'px',W/2,488);
}
function frame(t){const dt=last?Math.min(.032,(t-last)/1000):0;last=t;update(dt);if(t-lastState>1000){lastState=t;sendState()}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
try{if(window.cast&&cast.framework){receiver=cast.framework.CastReceiverContext.getInstance();receiver.addCustomMessageListener(NS,event=>{let m=event.data;if(typeof m==='string'){try{m=JSON.parse(m)}catch(e){return}}if(!m||typeof m!=='object')return;senderId=event.senderId||senderId;if(m.type==='hello'){lastSeq=-1;packetAt=0;targetVelocity=0;velocity=0;lastControl=Date.now();sendState()}

if(m.type==='paddle')handlePaddle(m);
if(m.type==='restart'){reset();lastControl=Date.now()}});
receiver.start({disableIdleTimeout:true});receiverStatus='Cast receiver running';
}else receiverStatus='Cast framework unavailable';}catch(e){receiverStatus='Receiver error: '+String(e.message||e)}
})();
</script></body></html>
