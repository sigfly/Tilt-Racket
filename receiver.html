<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tilt Racket TV</title><style>html,body{margin:0;width:100%;height:100%;background:#101e33;color:white;font-family:system-ui;overflow:hidden}canvas{width:100vw;height:100vh;display:block}</style></head><body><canvas id="screen"></canvas><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><script>
(()=>{'use strict';const c=document.getElementById('screen'),ctx=c.getContext('2d');const W=400,H=500,p={x:200,y:451,w:96,h:13},b={x:200,y:90,vx:65,vy:20,r:9};let target=200,hits=0,over=false,last=0,lastControl=0;const NS='urn:x-cast:com.tiltracket.game';function reset(){hits=0;over=false;b.x=200;b.y=90;b.vx=65;b.vy=20}function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=Math.round(innerWidth*d);c.height=Math.round(innerHeight*d);ctx.setTransform(c.width/W,0,0,c.height/H,0,0)}addEventListener('resize',resize);resize();function update(dt){p.x+=(target-p.x)*Math.min(1,dt*15);if(over)return;const old=b.y;b.vy+=420*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.vy>0&&old+b.r<=p.y&&b.y+b.r>=p.y&&Math.abs(b.x-p.x)<p.w/2+b.r){b.y=p.y-b.r;b.vy=-Math.min(530,330+hits*9);b.vx=(b.x-p.x)/(p.w/2)*165;hits++}if(b.y-b.r>H)over=true}function draw(){ctx.fillStyle='#101e33';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#20344d';for(let x=40;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=40;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#dce7f5';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText('HITS  '+hits,200,35);ctx.fillStyle='#51d7ae';ctx.beginPath();ctx.roundRect(p.x-p.w/2,p.y,p.w,p.h,7);ctx.fill();ctx.fillStyle='#ffd16b';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();if(over){ctx.fillStyle='rgba(4,10,20,.74)';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='bold 30px system-ui';ctx.fillText('Game over',200,240);ctx.font='16px system-ui';ctx.fillText('Restart on phone',200,275)}if(!lastControl){ctx.fillStyle='#dce7f5';ctx.font='14px system-ui';ctx.fillText('Waiting for phone controller…',200,75)}}function frame(t){const dt=last?Math.min(.032,(t-last)/1000):0;last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
if(window.cast?.framework){const receiver=cast.framework.CastReceiverContext.getInstance();receiver.addCustomMessageListener(NS,event=>{let m=event.data;if(typeof m==='string'){try{m=JSON.parse(m)}catch{return}}if(!m||typeof m!=='object')return;if(m.type==='paddle'&&Number.isFinite(m.x)){target=Math.max(p.w/2,Math.min(W-p.w/2,m.x*W));lastControl=Date.now()}if(m.type==='restart'){reset();lastControl=Date.now()}});receiver.start({disableIdleTimeout:true})}else{console.error('Cast Receiver Framework unavailable')}
})();</script></body></html>
